[workspace]
resolver = "2"
members = [
    "crates/bullet-math",
    "crates/bullet-collision",
    "crates/bullet-dynamics",
    "crates/bullet",
    # Browser demo harness (wasm32 cdylib; never built for the host).
    "tools/wasm-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Zlib"
authors = ["CrazyboyQCD <yzc13697716338@gmail.com>"]
repository = "https://github.com/CrazyboyQCD/bullet_physics"

[workspace.dependencies]
glam = { version = "0.33", default-features = false }
approx = "0.5"

# Release builds keep debug symbols so profilers (cargo-flamegraph / samply /
# ETW) can attribute samples to functions; the MSVC linker emits them into
# the PDB alongside the optimized code, so the runtime cost is zero.
[profile.release]
debug = true
# Cross-crate inlining for the hot narrow-phase/solver loops (glam calls live
# in bullet-math but inline into bullet-collision only under LTO). No
# floating-point reordering is involved, so numerics are unchanged.
lto = "fat"
codegen-units = 1
