[workspace]
resolver = "2"
members = [
    "crates/bullet-math",
    "crates/bullet-collision",
    "crates/bullet-dynamics",
    "crates/bullet-physics",
    "crates/bullet-inverse-dynamics",
    # Browser demo harness (wasm32 cdylib; never built for the host).
    "tools/wasm-demo",
]

[workspace.package]
version = "0.2.0"
rust-version = "1.88"
edition = "2024"
license = "Zlib"
authors = ["CrazyboyQCD <yzc13697716338@gmail.com>"]
repository = "https://github.com/CrazyboyQCD/bullet-physics"

[workspace.dependencies]
glam = { version = "0.33", default-features = false }
approx = "0.5"

# Opt-in profile for profiling and the perf harness. It inherits the stock
# release profile and only adds what our own tooling needs, so a plain
# `cargo build --release` keeps the vanilla Cargo settings.
#
# Debug symbols let profilers (cargo-flamegraph / samply / ETW) attribute
# samples to functions; the MSVC linker emits them into the PDB alongside the
# optimized code, so the runtime cost is zero.
[profile.release-debug]
inherits = "release"
debug = true
# Cross-crate inlining for the hot narrow-phase/solver loops (glam calls live
# in bullet-math but inline into bullet-collision only under LTO). No
# floating-point reordering is involved, so numerics are unchanged.
lto = "fat"
codegen-units = 1
