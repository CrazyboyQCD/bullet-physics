[package]
name = "bullet-inverse-dynamics"
description = "Inverse dynamics for tree-structured multibody systems: the Rust port of Bullet's BulletInverseDynamics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["physics", "robotics", "inverse-dynamics", "multibody", "no-std"]
categories = ["simulation", "science", "no-std"]

[features]
default = ["std", "f32"]
f32 = ["bullet-math/f32"]
f64 = ["bullet-math/f64"]
std = ["bullet-math/std"]
libm = ["bullet-math/libm"]

[dependencies]
bullet-math = { version = "0.2", path = "../bullet-math", default-features = false }

[dev-dependencies]
approx = { workspace = true }
