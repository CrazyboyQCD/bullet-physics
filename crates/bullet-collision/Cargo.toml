[package]
name = "bullet-collision"
description = "Collision detection for the bullet physics engine: shapes, broad phase, narrow phase, and contact manifolds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["std", "f32"]
f32 = ["bullet-math/f32"]
f64 = ["bullet-math/f64"]
std = ["bullet-math/std"]
libm = ["bullet-math/libm"]

[dependencies]
bullet-math = { version = "0.1", path = "../bullet-math", default-features = false }

[dev-dependencies]
approx = { workspace = true }
