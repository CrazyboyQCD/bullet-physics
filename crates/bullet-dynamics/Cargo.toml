[package]
name = "bullet-dynamics"
description = "Rigid body dynamics for the bullet physics engine: bodies, simulation world, and constraint solvers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["physics", "rigid-body", "constraints", "solver", "no-std"]
categories = ["simulation", "science", "game-development", "mathematics"]

[features]
default = ["std", "f32"]
f32 = ["bullet-math/f32", "bullet-collision/f32"]
f64 = ["bullet-math/f64", "bullet-collision/f64"]
std = ["bullet-collision/std"]
libm = ["bullet-collision/libm"]

[dependencies]
bullet-math = { version = "0.2", path = "../bullet-math", default-features = false }
bullet-collision = { version = "0.2", path = "../bullet-collision", default-features = false }

[dev-dependencies]
approx = { workspace = true }
