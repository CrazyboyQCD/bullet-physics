[package]
name = "bullet-math"
description = "Linear math layer for the bullet physics engine: SIMD-accelerated, precision-swappable glam aliases"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["math", "linear-algebra", "simd", "glam", "no-std"]
categories = ["mathematics", "simulation", "game-development", "no-std"]

[features]
default = ["std", "f32"]
f32 = []
f64 = ["glam/f64"]
# Scalar math backend selection: `std` routes transcendentals to the
# standard-library methods (default), `libm` routes them to the pure-Rust
# `libm` crate for no_std targets. Exactly one must be selected.
std = ["glam/std"]
libm = ["glam/nostd-libm", "dep:libm"]

[dependencies]
glam = { workspace = true, default-features = false, features = ["f64"] }
libm = { version = "0.2", optional = true }
