[package]
name = "bullet-physics"
description = "Facade crate aggregating the bullet physics engine (math, collision, and dynamics)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["physics", "collision-detection", "rigid-body", "softbody", "simulation"]
categories = ["game-development", "simulation", "science", "mathematics"]

# The parity and perf harness examples #[path]-include scene tables that are
# generated and git-ignored, so they are absent from the package and would not
# build there.
exclude = ["examples/record_scenes.rs", "examples/perf_scenes.rs"]

[features]
default = ["std", "f32"]
f32 = ["bullet-math/f32", "bullet-collision/f32", "bullet-dynamics/f32",
    "bullet-inverse-dynamics?/f32"]
f64 = ["bullet-math/f64", "bullet-collision/f64", "bullet-dynamics/f64",
    "bullet-inverse-dynamics?/f64"]
std = ["bullet-dynamics/std", "bullet-inverse-dynamics?/std"]
libm = ["bullet-dynamics/libm", "bullet-inverse-dynamics?/libm"]
# Tree-structured multibody inverse dynamics (`bullet-inverse-dynamics`),
# re-exported as `inverse_dynamics`. Off by default: the subsystem is an
# independent leaf crate and stays out of the default dependency tree.
inverse-dynamics = ["dep:bullet-inverse-dynamics"]

[dependencies]
bullet-math = { version = "0.2", path = "../bullet-math", default-features = false }
bullet-collision = { version = "0.2", path = "../bullet-collision", default-features = false }
bullet-dynamics = { version = "0.2", path = "../bullet-dynamics", default-features = false }
bullet-inverse-dynamics = { version = "0.2", path = "../bullet-inverse-dynamics",
    default-features = false, optional = true }

# The probe twins are verification rigs (docs/parity-harness.md), not demos;
# these two exercise the optional inverse-dynamics re-export.
[[example]]
name = "id_probe"
required-features = ["inverse-dynamics"]

[[example]]
name = "id_alloc"
required-features = ["inverse-dynamics"]

[[example]]
name = "inverse_dynamics"
required-features = ["inverse-dynamics"]
