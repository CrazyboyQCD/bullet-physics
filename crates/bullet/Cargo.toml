[package]
name = "bullet"
description = "Facade crate aggregating the bullet physics engine (math, collision, and dynamics)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["std", "f32"]
f32 = ["bullet-math/f32", "bullet-collision/f32", "bullet-dynamics/f32"]        
f64 = ["bullet-math/f64", "bullet-collision/f64", "bullet-dynamics/f64"]        
std = ["bullet-dynamics/std"]
libm = ["bullet-dynamics/libm"]

[dependencies]
bullet-math = { path = "../bullet-math", default-features = false }
bullet-collision = { path = "../bullet-collision", default-features = false }
bullet-dynamics = { path = "../bullet-dynamics", default-features = false }
